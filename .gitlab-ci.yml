workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_BRANCH == "main"'

stages: [validate, image]

validate-composer:
  stage: validate
  image: composer:2
  script:
    - composer validate --no-check-publish

build-image:
  stage: image
  image: quay.io/buildah/stable
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot
  script:
    - sh tests/Deployment/ci-check.sh
    - sh container/ci-build.sh
  artifacts:
    paths: [release.env]
    expire_in: 1 year
